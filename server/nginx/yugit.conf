# 驭Git 云服务的反向代理。
#
# 证书用 certbot 签：
#   certbot certonly --standalone -d api.你的域名
# 没有域名的话可以先跳过 TLS 直接暴露 8080 测试，但**不要拿它接真实付费用户**——
# 订阅凭据会以明文在网上跑。

server {
    listen 80;
    server_name api.example.com;
    # 除了 ACME 验证，其余一律跳 HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 流式转发的关键三行。少任何一行，SSE 都会被 nginx 攒起来批量发出，
        # 客户端看到的就是「卡半天然后一次性蹦出全文」——网关那边做的 Flush 全白费。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        # 补全可能跑几十秒，默认 60s 会在生成中途断开
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
