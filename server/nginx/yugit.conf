# 驭Git 云服务的反向代理。
#
# 这份配置**只写 80**，TLS 交给 certbot 补：
#
#   certbot --nginx -d yugit.你的域名
#
# certbot 会把下面这个 server 块就地改成 443 ssl、另建一个 80 的跳转块，
# 并且**原样保留 location 里的内容**——包括那三行流式配置。
# 自己手写 443 块反而容易和 certbot 的自动续期打架。
#
# 前提：安全组/防火墙要放行 80，certbot 的 HTTP-01 验证走的就是它。
# 只开了 443 的话验证会失败，因为 Let's Encrypt 固定从 80 发起。

server {
    listen 80;
    listen [::]:80;
    server_name yugit.educy.top;

    # 上传的是脱敏后的 diff，正常远小于 4MB（网关那边也按 4MB 拦）
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 流式转发的关键三行。少任何一行，SSE 都会被 nginx 攒起来批量发出，
        # 客户端看到的就是「卡半天然后一次性蹦出全文」——网关那边做的 Flush 全白费。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        # 补全可能跑几十秒，默认 60s 会在生成中途断开
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
