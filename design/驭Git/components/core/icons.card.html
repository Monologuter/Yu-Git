<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>html,body{margin:0}body{background:var(--surface-app);color:var(--text-body);font:var(--type-body);padding:16px;-webkit-font-smoothing:antialiased}.grid{display:flex;flex-direction:column;gap:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.lbl{font:var(--type-caption);color:var(--ink-3);width:64px;flex:0 0 auto;text-align:right}.pane{border:1px solid var(--hairline);border-radius:var(--radius-large);overflow:hidden;background:var(--surface-app)}</style>

<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Icon } = window.Git_c7d67c;
const SETS = [
  ['Git', ['git-branch','git-merge','git-pull-request','cloud','tag','archive','layers','columns-2']],
  ['动作', ['circle-arrow-down','arrow-down-to-line','arrow-up-to-line','refresh-cw','rotate-ccw','undo-2','plus','trash-2','copy','pencil']],
  ['状态', ['circle-check','triangle-alert','circle-x','info','shield','shield-check','lock','eye-off','clock-alert']],
  ['界面', ['list-filter','search','command','ellipsis','panel-left','panel-right','chevron-right','chevron-down','folder','file-text','sparkles','lightbulb']],
];
function Demo() {
  return (
    <div className="grid">
      {SETS.map(([label, names]) => (
        <div className="row" key={label}>
          <span className="lbl">{label}</span>
          {names.map((n) => (
            <span key={n} title={n} style={{display:'flex',alignItems:'center',justifyContent:'center',width:26,height:26,borderRadius:'var(--radius-small)',background:'var(--surface-sunken)',color:'var(--ink-1)'}}>

      ))}

        <Icon name="git-branch" size={11} /><Icon name="git-branch" size={14} /><Icon name="git-branch" size={16} />
        <span style={{font:'var(--type-caption)',color:'var(--ink-3)'}}>11 配 11pt · 14 配正文 · 16 配工具栏</span>
        <span style={{width:12}} />
        <Icon name="sparkles" size={14} color="var(--brand)" />
        <span style={{font:'var(--type-caption)',color:'var(--ink-3)'}}>AI 入口一律品牌青</span>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
