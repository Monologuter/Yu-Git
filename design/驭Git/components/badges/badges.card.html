<!-- @dsCard group="Components" viewport="700x180" name="徽章与状态 Badges" subtitle="ref 徽章 · 计数胶囊 · 状态字母 · ahead/behind" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>徽章与状态 Badges</title>
<link rel="stylesheet" href="../../styles.css">
<script>window.YUGIT_ICON_BASE='../../assets/icons/'</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>html,body{margin:0}body{background:var(--surface-app);color:var(--text-body);font:var(--type-body);padding:16px;-webkit-font-smoothing:antialiased}.grid{display:flex;flex-direction:column;gap:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.lbl{font:var(--type-caption);color:var(--ink-3);width:64px;flex:0 0 auto;text-align:right}.pane{border:1px solid var(--hairline);border-radius:var(--radius-large);overflow:hidden;background:var(--surface-app)}</style>
</head><body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { RefBadge, CountPill, StatusLetter, TrackingBadge } = window.Git_c7d67c;
const STATUSES = ['added','modified','deleted','renamed','copied','untracked','unmerged','ignored'];
function Demo() {
  return (
    <div className="grid">
      <div className="row"><span className="lbl">ref</span>
        <RefBadge kind="local">kino-aigc-chenya</RefBadge>
        <RefBadge kind="remote">origin/master</RefBadge>
        <RefBadge kind="tag">v2.2.0</RefBadge>
        <span style={{padding:'2px 6px',borderRadius:4,background:'var(--selection-bg)',display:'flex',gap:4}}>
          <RefBadge kind="local" emphasized>选中行上</RefBadge>
        </span>
      </div>
      <div className="row"><span className="lbl">计数</span>
        <CountPill>2</CountPill><CountPill>203</CountPill><CountPill tone="warn">3 冲突</CountPill>
        <span style={{width:16}} />
        <span className="lbl">跟踪</span>
        <TrackingBadge ahead={2} /><TrackingBadge behind={1} /><TrackingBadge ahead={3} behind={12} /><TrackingBadge gone />
      </div>
      <div className="row"><span className="lbl">状态</span>
        {STATUSES.map((s) => (
          <span key={s} style={{display:'flex',alignItems:'center',gap:4,font:'var(--type-caption)',color:'var(--ink-3)'}}>
            <StatusLetter status={s} />{s}
          </span>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
