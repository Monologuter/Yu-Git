<!-- @dsCard group="Spacing" viewport="700x160" name="间距六档" subtitle="2 / 4 / 8 / 12 / 16 / 24，跟着 macOS 的 4pt 网格" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>间距</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);color:var(--text-body);font:var(--type-body);padding:16px;-webkit-font-smoothing:antialiased}
.sw{display:flex;flex-direction:column;gap:4px}.chip{height:44px;border-radius:var(--radius-medium)}
.nm{font:var(--type-secondary);color:var(--ink-2)}.hx{font:var(--type-mono);color:var(--ink-3);text-transform:uppercase}
.grid{display:flex;gap:10px}.col{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:12px}
.note{font:var(--type-caption);color:var(--ink-3)}.r{display:flex;align-items:center;gap:12px;padding:3px 0}.t{width:130px;flex:0 0 auto;font:var(--type-caption);color:var(--ink-3)}.bar{height:14px;background:var(--brand-wash-strong);border-radius:2px}</style></head><body>
<div class="r"><span class="t">hairline · 2</span><span class="bar" style="width:2px"></span><span class="note">同一行内紧密相关的两个元素</span></div>
<div class="r"><span class="t">tight · 4</span><span class="bar" style="width:4px"></span><span class="note">一组内部</span></div>
<div class="r"><span class="t">regular · 8</span><span class="bar" style="width:8px"></span><span class="note">默认，拿不准时用这个</span></div>
<div class="r"><span class="t">loose · 12</span><span class="bar" style="width:12px"></span><span class="note">相关的两组之间</span></div>
<div class="r"><span class="t">section · 16</span><span class="bar" style="width:16px"></span><span class="note">区块之间</span></div>
<div class="r"><span class="t">major · 24</span><span class="bar" style="width:24px"></span><span class="note">大块留白，只在 sheet 与欢迎页</span></div>
</body></html>
