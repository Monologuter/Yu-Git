<!-- @dsCard group="Spacing" viewport="700x180" name="状态与动效" subtitle="hover 加底色 · press 再深一档 · focus 描 2px 强调色 · 动画只做淡入淡出" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>状态与动效</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);color:var(--text-body);font:var(--type-body);padding:16px;-webkit-font-smoothing:antialiased}
.sw{display:flex;flex-direction:column;gap:4px}.chip{height:44px;border-radius:var(--radius-medium)}
.nm{font:var(--type-secondary);color:var(--ink-2)}.hx{font:var(--type-mono);color:var(--ink-3);text-transform:uppercase}
.grid{display:flex;gap:10px}.col{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:12px}
.note{font:var(--type-caption);color:var(--ink-3)}.box{height:30px;border-radius:var(--radius-medium);display:flex;align-items:center;padding:0 10px;font:var(--type-body)}</style></head><body>
<div style="display:flex;gap:10px">
<div class="sw col"><div class="box" style="background:transparent;border:1px solid var(--hairline)">默认</div><span class="note">透明底</span></div>
<div class="sw col"><div class="box" style="background:var(--surface-hover)">悬停</div><span class="note">--surface-hover</span></div>
<div class="sw col"><div class="box" style="background:var(--surface-press)">按下</div><span class="note">--surface-press</span></div>
<div class="sw col"><div class="box" style="background:var(--fill-quaternary);box-shadow:inset 0 0 0 2px var(--focus-ring)">聚焦</div><span class="note">2px --focus-ring</span></div>
<div class="sw col"><div class="box" style="background:var(--selection-bg);color:var(--selection-fg)">选中</div><span class="note">--selection-bg</span></div>
<div class="sw col"><div class="box" style="background:transparent;border:1px solid var(--hairline);opacity:.4">禁用</div><span class="note">opacity .4 + title 说明原因</span></div>
</div>
<div style="margin-top:16px;display:flex;gap:20px;font:var(--type-secondary);color:var(--ink-2)">
<span>90ms 即时</span><span>120ms 焦点环 / hover</span><span>150ms 图标淡入淡出</span><span>220ms sheet</span><span style="font:var(--type-mono);color:var(--ink-3)">cubic-bezier(.42,0,.58,1)</span>
</div>
<p class="note" style="margin:10px 0 0">不做位移动画、不做弹跳、不做进场序列。图标切换只淡入淡出 —— 按钮在原地变，视线不用跟着跑。悬停才显形的按钮（分组头、hunk 头、目录行）不给过渡，直接出现。</p>
</body></html>
