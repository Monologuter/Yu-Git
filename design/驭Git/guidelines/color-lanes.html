<!-- @dsCard group="Colors" viewport="700x180" name="分支图 8 轨道" subtitle="等距色相 + 两档明度；避开红绿；相邻 colorIndex 永远跨档" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>分支图色板</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);color:var(--text-body);font:var(--type-body);padding:16px;-webkit-font-smoothing:antialiased}
.sw{display:flex;flex-direction:column;gap:4px}.chip{height:44px;border-radius:var(--radius-medium)}
.nm{font:var(--type-secondary);color:var(--ink-2)}.hx{font:var(--type-mono);color:var(--ink-3);text-transform:uppercase}
.grid{display:flex;gap:10px}.col{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:12px}
.note{font:var(--type-caption);color:var(--ink-3)}</style></head><body>
<div class="grid">
<div class="sw col"><div class="chip" style="background:var(--lane-1);height:56px"></div><span class="nm">1 青</span><span class="hx">#00857A</span></div><div class="sw col"><div class="chip" style="background:var(--lane-2);height:56px"></div><span class="nm">2 紫</span><span class="hx">#A665E5</span></div><div class="sw col"><div class="chip" style="background:var(--lane-3);height:56px"></div><span class="nm">3 琥</span><span class="hx">#9A6704</span></div><div class="sw col"><div class="chip" style="background:var(--lane-4);height:56px"></div><span class="nm">4 蓝</span><span class="hx">#089DC1</span></div><div class="sw col"><div class="chip" style="background:var(--lane-5);height:56px"></div><span class="nm">5 玫</span><span class="hx">#B63795</span></div><div class="sw col"><div class="chip" style="background:var(--lane-6);height:56px"></div><span class="nm">6 碧</span><span class="hx">#00A86E</span></div><div class="sw col"><div class="chip" style="background:var(--lane-7);height:56px"></div><span class="nm">7 靛</span><span class="hx">#3A68E0</span></div><div class="sw col"><div class="chip" style="background:var(--lane-8);height:56px"></div><span class="nm">8 赭</span><span class="hx">#E85A0E</span></div>
</div>
<div style="margin-top:12px;display:flex;gap:2px;align-items:center">
<span style="flex:1;height:6px;border-radius:3px;background:var(--lane-1)"></span><span style="flex:1;height:6px;border-radius:3px;background:var(--lane-2)"></span><span style="flex:1;height:6px;border-radius:3px;background:var(--lane-3)"></span><span style="flex:1;height:6px;border-radius:3px;background:var(--lane-4)"></span><span style="flex:1;height:6px;border-radius:3px;background:var(--lane-5)"></span><span style="flex:1;height:6px;border-radius:3px;background:var(--lane-6)"></span><span style="flex:1;height:6px;border-radius:3px;background:var(--lane-7)"></span><span style="flex:1;height:6px;border-radius:3px;background:var(--lane-8)"></span>
</div>
<p class="note" style="margin:10px 0 0">明度两档（L* 0.555 / 0.645）：8 个等明度色相在色觉缺陷下必然有几对糊在一起，明度是那时唯一还可靠的通道。两档只差 0.09，正常视力下看不出「脏」。</p>
</body></html>
