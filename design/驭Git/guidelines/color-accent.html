<!-- @dsCard group="Colors" viewport="700x150" name="系统强调色与选中" subtitle="默认主题跟随系统强调色，此处是系统默认蓝的落地值" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>系统强调色</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);color:var(--text-body);font:var(--type-body);padding:16px;-webkit-font-smoothing:antialiased}
.sw{display:flex;flex-direction:column;gap:4px}.chip{height:44px;border-radius:var(--radius-medium)}
.nm{font:var(--type-secondary);color:var(--ink-2)}.hx{font:var(--type-mono);color:var(--ink-3);text-transform:uppercase}
.grid{display:flex;gap:10px}.col{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:12px}
.note{font:var(--type-caption);color:var(--ink-3)}</style></head><body>
<div class="grid">
<div class="sw col"><div class="chip" style="background:var(--accent);height:44px"></div><span class="nm">--accent</span><span class="hx">#007AFF</span><span class="note">按钮填充、焦点环</span></div>
<div class="sw col"><div class="chip" style="background:var(--accent-selection);height:44px"></div><span class="nm">--accent-selection</span><span class="hx">#0064E1</span><span class="note">选中行背景</span></div>
<div class="sw col"><div class="chip" style="background:var(--accent-wash);height:44px"></div><span class="nm">--accent-wash</span><span class="hx">#E8F1FF</span><span class="note">选中行的浅底</span></div>
<div class="sw col" style="flex:1.4"><div class="chip" style="height:44px;background:var(--accent-selection);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--accent-on)"><span style="font:var(--type-body)">积分冻结参数转成大写</span><span style="font:var(--type-mono);opacity:.72">01cd06d2</span></div><span class="nm">选中行：文字 100% / 72% 两档</span><span class="hx">--selection-fg #FFFFFF</span></div>
</div>
<p class="note" style="margin:14px 0 0">用户在系统设置里换了强调色，这三个值就跟着换 —— 所以任何需要「永远是这个颜色」的地方（品牌、状态）都不能用它们。</p>
</body></html>
