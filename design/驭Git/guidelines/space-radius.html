<!-- @dsCard group="Spacing" viewport="700x130" name="圆角三档" subtitle="4 徽章 / 6 按钮与输入框 / 10 卡片与面板" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>圆角</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);color:var(--text-body);font:var(--type-body);padding:16px;-webkit-font-smoothing:antialiased}
.sw{display:flex;flex-direction:column;gap:4px}.chip{height:44px;border-radius:var(--radius-medium)}
.nm{font:var(--type-secondary);color:var(--ink-2)}.hx{font:var(--type-mono);color:var(--ink-3);text-transform:uppercase}
.grid{display:flex;gap:10px}.col{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:12px}
.note{font:var(--type-caption);color:var(--ink-3)}</style></head><body>
<div style="display:flex;gap:16px;align-items:flex-end">
<div class="sw"><div style="width:110px;height:44px;border-radius:var(--radius-small);background:var(--surface-sunken);border:1px solid var(--hairline)"></div><span class="nm">small 4</span><span class="note">徽章、状态底、选中的文件行</span></div>
<div class="sw"><div style="width:110px;height:44px;border-radius:var(--radius-medium);background:var(--surface-sunken);border:1px solid var(--hairline)"></div><span class="nm">medium 6</span><span class="note">按钮、输入框、分段控件</span></div>
<div class="sw"><div style="width:110px;height:44px;border-radius:var(--radius-large);background:var(--surface-sunken);border:1px solid var(--hairline)"></div><span class="nm">large 10</span><span class="note">卡片、面板、sheet</span></div>
<div class="sw"><div style="width:110px;height:24px;border-radius:var(--radius-capsule);background:var(--fill-quaternary)"></div><span class="nm">capsule</span><span class="note">ref 徽章、计数</span></div>
</div>
</body></html>
