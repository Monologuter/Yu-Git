<!-- @dsCard group="Colors" viewport="700x170" name="文字四级" subtitle="比系统语义灰更深一档：11pt 的 hash 与时间也要够 AA" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>文字四级</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);color:var(--text-body);font:var(--type-body);padding:16px;-webkit-font-smoothing:antialiased}
.sw{display:flex;flex-direction:column;gap:4px}.chip{height:44px;border-radius:var(--radius-medium)}
.nm{font:var(--type-secondary);color:var(--ink-2)}.hx{font:var(--type-mono);color:var(--ink-3);text-transform:uppercase}
.grid{display:flex;gap:10px}.col{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:12px}
.note{font:var(--type-caption);color:var(--ink-3)}</style></head><body>
<div class="grid">
<div class="sw col"><div class="chip" style="background:var(--ink-1)"></div><span class="nm">--ink-1 正文</span><span class="hx">#151618 · 18.1:1</span></div>
<div class="sw col"><div class="chip" style="background:var(--ink-2)"></div><span class="nm">--ink-2 次要</span><span class="hx">#55585C · 7.2:1</span></div>
<div class="sw col"><div class="chip" style="background:var(--ink-3)"></div><span class="nm">--ink-3 三级</span><span class="hx">#6F7276 · 4.8:1</span></div>
<div class="sw col"><div class="chip" style="background:var(--ink-4)"></div><span class="nm">--ink-4 装饰</span><span class="hx">#9C9FA2 · 2.7:1</span></div>
</div>
<div style="margin-top:14px;display:flex;flex-direction:column;gap:2px">
<span style="font:var(--type-body);color:var(--ink-1)">fix: 导航新增弹窗 —— 提交标题、文件名走 ink-1</span>
<span style="font:var(--type-secondary);color:var(--ink-2)">李泽林 · 分支名、作者走 ink-2</span>
<span style="font:var(--type-mono);color:var(--ink-3)">6b054b88 · 4 个月前 —— hash、时间、行号走 ink-3</span>
</div>
<p class="note" style="margin:10px 0 0">ink-4 永不承载文字信息，只做禁用态与分隔装饰。</p>
</body></html>
