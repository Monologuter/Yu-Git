<!-- @dsCard group="Brand" viewport="700x190" name="品牌字与口号" subtitle="没有图形 logo：所有出现「标志」的地方都用这个字组" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>品牌字</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);color:var(--text-body);font:var(--type-body);padding:16px;-webkit-font-smoothing:antialiased}
.sw{display:flex;flex-direction:column;gap:4px}.chip{height:44px;border-radius:var(--radius-medium)}
.nm{font:var(--type-secondary);color:var(--ink-2)}.hx{font:var(--type-mono);color:var(--ink-3);text-transform:uppercase}
.grid{display:flex;gap:10px}.col{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:12px}
.note{font:var(--type-caption);color:var(--ink-3)}</style></head><body>
<div style="display:flex;gap:24px;align-items:center">
<div style="width:96px;height:96px;border-radius:22px;background:var(--brand);color:var(--brand-on);display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);font-size:56px;font-weight:600">驭</div>
<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-family:var(--font-ui);font-size:var(--text-size-display);font-weight:600;letter-spacing:var(--tracking-display)">驭Git</span>
<span style="font:var(--type-callout);color:var(--ink-2)">AI 帮你写代码，驭Git 帮你驾驭它</span>
<span class="note">英文名 Yugit。中文名里的「Git」保留英文、不加空格；「驭」为半角前后无空格。</span>
</div>
</div>
<p class="note" style="margin:14px 0 0">仓库里没有任何图形标志，这份设计系统也不替它造一个。需要方形图标时用青底 + 白「驭」，字重 600，圆角 22（macOS 图标比例）。</p>
</body></html>
