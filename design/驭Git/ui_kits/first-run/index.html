<script type="text/babel">
const { EmptyState, Button } = window.Git_c7d67c;

function App() {
  const [stage, setStage] = React.useState('welcome');
  return (
    <div style={{ position: 'relative', height: '100%', background: 'var(--surface-app)' }}>
      {stage === 'done' ? (
        <EmptyState
          icon="circle-check" title="引导走完了"
          description="第一次打开仓库时自动走一遍，之后不再打扰；命令面板里随时能再看一次。"
          action={<a href="../mac-app/index.html"><Button variant="default">进入仓库工作区</Button></a>}
        />
      ) : (
        <Welcome onOpen={() => setStage('tour')} />
      )}

      {stage === 'tour' ? (
        <div style={{
          position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
          background: 'rgba(0,0,0,0.10)', backdropFilter: 'var(--blur-overlay)', WebkitBackdropFilter: 'var(--blur-overlay)',
        }}>
          <Tour onFinish={() => setStage('done')} />
        </div>
      ) : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
