<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>驭Git Design System</title>
<link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{display:flex;width:1280px;height:854px;overflow:hidden;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
.main{flex:1;background:var(--brand);display:flex;align-items:center;justify-content:center}
.mark{color:#fff;font-size:300px;font-weight:600;letter-spacing:-0.02em;line-height:1.1;white-space:nowrap}
.strip{width:320px;display:flex;flex-direction:column}.strip>i{flex:1}</style>
</head><body>
<div class="main"><span class="mark">驭Git</span></div>
<div class="strip">
<i style="background:var(--lane-3)"></i>
<i style="background:var(--lane-4)"></i>
<i style="background:var(--lane-5)"></i>
<i style="background:var(--lane-7)"></i>
</div>
</body></html>
